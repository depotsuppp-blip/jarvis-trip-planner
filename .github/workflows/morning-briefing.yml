# Jarvis Morning Briefing: Tech & AI news in Thai + today's calendar, pushed to LINE
# at 07:05 Asia/Bangkok - on GitHub's runners, so the PC can be off.
# The script and its settings: scripts/morning_briefing.py (docstring at the top).
#
# Secrets (Settings -> Secrets and variables -> Actions -> New repository secret):
#   OPENAI_API_KEY              required
#   LINE_CHANNEL_ACCESS_TOKEN   required
#   LINE_TARGET_USER_ID         required (or LINE_USER_ID, the older name - either one)
#   GOOGLE_TOKEN_JSON           optional: the whole token.json from `python utils/google_auth.py`
#   GOOGLE_CALENDAR_ID          optional: default "primary"
#   DATABASE_URL                optional: a Postgres URL allowed to SELECT from jarvis_memory
# A missing optional secret just leaves that line off the cover card.
#
# The repository is public, so are these logs: the script prints counts and public
# news only, and in a dry run it hides the calendar and project lines.

name: Morning Briefing

on:
  schedule:
    # GitHub reads cron in UTC: 00:05 UTC = 07:05 in Bangkok (UTC+7 all year). Five
    # past, not on the hour: the top of the hour is when GitHub's scheduler is busiest.
    # It still starts scheduled runs late at busy times, and very late now and then
    # (2026-11-21: the 01:00 UTC run started at 08:05 UTC, 15:05 in Bangkok), may drop
    # one, and pauses schedules in a public repo after 60 days without commits
    # (re-enable it on the Actions tab).
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build the briefing and check it with LINE, but send nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: morning-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the script
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Only the files at the top level (requirements-briefing.txt) and scripts/ -
          # not the web app or the voice assistant.
          sparse-checkout: scripts

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-briefing.txt

      - name: Install the briefing's dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-briefing.txt

      - name: Build and send the briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_USER_ID: ${{ secrets.LINE_TARGET_USER_ID }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/morning_briefing.py --dry-run --validate-line
          else
            python scripts/morning_briefing.py
          fi
